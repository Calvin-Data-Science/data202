<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/theme/simple.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/highlight/monokai.css">
  <style>
    .reveal .slides section {
      text-align: left;
      padding: 1.5rem 2.5rem;
      box-sizing: border-box;
      overflow-y: auto;
      height: 100%;
    }
    .reveal table { font-size: 0.55em; width: 100%; }
    .back-link {
      position: fixed;
      top: 0.6rem; left: 0.8rem;
      z-index: 1000;
      font-size: 0.8rem;
      color: #555;
      text-decoration: none;
      background: rgba(255,255,255,0.9);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .back-link:hover { color: #000; }
  </style>
</head>
<body>
  <a href="./" class="back-link">← Week</a>

  <div class="reveal">
    <div class="slides" id="slides-container"></div>
  </div>

  <div id="raw-content" style="display:none">{{ content }}</div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/notes/notes.js"></script>
  <script>
    (function () {
      var raw = document.getElementById('raw-content').innerHTML;
      var slidesEl = document.getElementById('slides-container');
      raw.split(/<hr\s*\/?>/gi).forEach(function (part) {
        var trimmed = part.trim();
        if (trimmed) {
          var sec = document.createElement('section');
          sec.innerHTML = trimmed;
          slidesEl.appendChild(sec);
        }
      });
    })();

    Reveal.initialize({
      hash: true,
      width: 1050,
      height: 700,
      margin: 0.04,
      minScale: 0.5,
      maxScale: 1.5,
      plugins: [RevealHighlight, RevealNotes]
    });
  </script>
</body>
</html>
