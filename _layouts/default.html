<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
    {% if page.math %}
    <script>MathJax = { tex: { inlineMath: [['$','$']], displayMath: [['$$','$$'],['\\[','\\]']] } };</script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
    {% endif %}
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p class="site-subtitle">Fall 2026 · Calvin University</p>
        <nav class="site-nav" aria-label="Primary">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/syllabus/' | relative_url }}">Syllabus</a>
          <a href="{{ '/weeks/' | relative_url }}">Weeks</a>
          <a href="{{ '/resources/' | relative_url }}">Resources</a>
          <a href="{{ '/finalproject/' | relative_url }}">Final Project</a>
        </nav>
      </div>
    </header>

    <main class="container content">
      {{ content }}
    </main>

    <aside class="toc-sidebar" id="toc-sidebar" aria-label="Page contents">
      <p class="toc-label">On this page</p>
      <nav id="toc-nav"></nav>
    </aside>

    <script>
    (function () {
      var headings = document.querySelectorAll('main h2, main h3');
      if (headings.length < 2) return;
      var nav = document.getElementById('toc-nav');
      var sidebar = document.getElementById('toc-sidebar');
      headings.forEach(function (h) {
        if (!h.id) {
          h.id = h.textContent.trim().toLowerCase()
            .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
        }
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent.trim();
        a.className = 'toc-link toc-' + h.tagName.toLowerCase();
        nav.appendChild(a);
      });
      sidebar.classList.add('has-toc');
    })();
    </script>
  </body>
</html>
