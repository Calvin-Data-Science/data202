project:
  type: "website"
  output-dir: _site
  render:
    - "*.qmd"
    - "!private"
    - "!*-soln.qmd"
    - "!*-template.qmd"
  post-render: "rsync -r static/ _site"

website:
  title: "DATA 202 (Wrangling and Analytics), Fall 2023"
  site-url: "https://calvin-data-science.github.io/data202/"
  navbar:
    right:
      - index.qmd
      - text: "RStudio"
        href: "https://r.cs.calvin.edu/"
  sidebar:
    contents: auto
  page-navigation: true

format:
  html:
    css: styles.css
    toc: true
    toc_depth: 2
    toc_float: true

execute:
  freeze: auto
  daemon: 3600
