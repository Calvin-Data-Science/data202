# Per-week deadline configuration.
# Omit a key (or set to false) if it doesn't apply that week.
#
#   moodle_reading      — H5P interactive reading on Moodle, due Monday of that week at midnight
#   practice            — Practice notebook number; submitted via GitHub Classroom, due Monday of the following week
#   quiz                — Quiz number; held in class on Friday
#   forum               — Forum number; reflection post on Moodle, due Wednesday of the following week
#   book_chapter        — Chapter number of "Counting" by Deborah Stone (read before writing the forum post)
#   book_chapter_title  — Short chapter title; fill in when known
#   milestone           — Project milestone number
#   milestone_date      — Due date string for the milestone (e.g. "Sat Oct 24")
#   note                — Extra reminder line shown in the deadlines box

- week: 1
  moodle_reading: true
  note: "Remember to do all the course setup steps!"

- week: 2
