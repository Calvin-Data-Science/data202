title: DATA202 - Introduction to Machine Learning
description: Course website for DATA202 - Introduction to Machine Learning at Calvin University
baseurl: /courses/data/202/26fa
markdown: kramdown
theme: null

exclude:
  - "textbooks/"
  # Everything under grades/ except grade-data/ (pseudonym-keyed, meant to be public)
  # holds real student names — never deploy it.
  - "grades/*.xlsx"
  - "grades/*.csv"
  - "grades/*.py"
  - "grades/messages.txt"
  - "grades/practices/"
  - "deploy.ps1"
  - "weeks/**/dist/autograder/"
  - "**/*.h5p"
  - "weeks/**/quiz*.md"
  - "weeks/**/quiz*.pdf"
  - "weeks/**/*_handout.md"   # handout sources; the built *_handout.pdf is published
  - "scripts/build_quiz.py"
  - "scripts/quiz_content/"
