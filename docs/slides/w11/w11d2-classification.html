## Can a blood test diagnose autism?

We'll use an example from &lt;https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1005385#pcbi.1005385.s001&gt;


```r
data_filename &lt;- "data/autism.csv"
if (!file.exists(data_filename)) {
  dir.create("data")
  download.file("https://doi.org/10.1371/journal.pcbi.1005385.s001", data_filename)
}
```


```r
col_names &lt;- names(read_csv(data_filename, n_max = 1, col_types = cols(.default = col_character())))
autism &lt;- read_csv(data_filename, skip = 2, col_names = col_names, col_types = cols(
  .default = col_double(),
  Group = col_character()
))
```

autism = r.autism
```

## EDA


```r

  pivot_longer(-Group, names_to = "Measure") %&gt;% 
  ggplot(aes(x = value, y = Group)) +

  ggridges::theme_ridges()

## Can we predict ASD vs non-ASD from metabolites?

Stratify by `group` to ensure each fold has good representation.


```r
no_sibs &lt;- without_behavior_scores %&gt;% filter(Group != "SIB")

resamples &lt;- no_sibs %&gt;% vfold_cv(v = 10, strata = Group)
```


```r
spec &lt;- workflow() %&gt;% add_recipe(
  recipe(Group ~ ., data = without_behavior_scores)) %&gt;% 
  add_model(logistic_reg() %&gt;% set_engine("glm"))

cv_results &lt;- spec %&gt;% 
  fit_resamples(resamples, metrics = metric_set(yardstick::accuracy, yardstick::sensitivity, yardstick::specificity))
```


```r
cv_results %&gt;% 
  collect_metrics(summarize = FALSE) %&gt;% 
  ggplot(aes(x = .estimate, y = .metric)) + geom_boxplot()
```

&lt;img src="w11d2-classification_files/figure-html/unnamed-chunk-19-1.png" width="100%" style="display: block; margin: auto;" /&gt;


```r
spec &lt;- workflow() %&gt;% add_recipe(
  recipe(Group ~ ., data = no_sibs) %&gt;% step_normalize(all_numeric())) %&gt;% 
  add_model(
    #parsnip::decision_tree(mode = "classification") %&gt;% set_engine("rpart")
    logistic_reg(penalty = 1.0) %&gt;% set_engine("glmnet")
  )

cv_results &lt;- spec %&gt;% 
  fit_resamples(resamples, metrics = metric_set(yardstick::accuracy, yardstick::sensitivity, yardstick::specificity))
```


```r
cv_results %&gt;% 
  collect_metrics(summarize = FALSE) %&gt;% 
  ggplot(aes(x = .estimate, y = .metric)) + geom_boxplot()
```

&lt;img src="w11d2-classification_files/figure-html/unnamed-chunk-21-1.png" width="100%" style="display: block; margin: auto;" /&gt;

model &lt;- spec %&gt;% fit(no_sibs)
